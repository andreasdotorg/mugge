# Mixxx seed configuration — deployed only if ~/.mixxx/mixxx.cfg does not exist.
# Settings from the working Debian Trixie Pi (2026-04-19 baseline audit).
# Mixxx overwrites this file at exit — runtime changes are preserved.

[Soundcard]
Samplerate=48000

[Waveform]
WaveformType=17
FrameRate=60
VSync=0
DefaultZoom=3

[Config]
ResizableSkin=LateNight
Scheme=PaleMoon
ScaleFactor=1
hide_menubar=1
InhibitScreensaver=1
StartInFullscreen=0

[Preferences]
multi_sampling=0

[Skin]
show_4decks=0
show_waveforms=1
show_spinnies=1
show_samplers=0
show_microphones=0
show_preview_decks=0

[InternalClock]
bpm=138

[Mixer Profile]
xFaderCurve=1
xFaderMode=0
HiEQFrequencyPrecise=2499.925
LoEQFrequencyPrecise=250.004
EQsOnly=1

[Controls]
CueDefault=0
RateRangePercent=8

[ReplayGain]
InitialDefaultBoost=-6
ReplayGainEnabled=1

[Master]
mono_mixdown=0
keylock_engine=1

[Channel1]
orientation=0

[Channel2]
orientation=2

[Channel3]
orientation=0

[Channel4]
orientation=2
