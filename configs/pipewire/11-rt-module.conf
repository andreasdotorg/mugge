# F-291 Fix C: Disable mod.rt nice level manipulation.
#
# Problem: PipeWire's mod.rt calls setpriority(nice.level=-11) at startup.
# On NixOS, no PAM nice limit exists for the audio user, so the call fails
# with EPERM. mod.rt's error handler then resets scheduling to SCHED_OTHER,
# undoing systemd's pre-exec FIFO/88.
#
# Fix: Override module-rt args via context.properties (the documented
# override mechanism — see pipewire.conf comment "use module.rt.args = { ... }
# to override the arguments"). nice.level=0 prevents the setpriority() call
# from failing. rt.prio=88 matches systemd's pre-exec FIFO/88 for clarity,
# though NNP=1 blocks mod.rt's sched_setscheduler() regardless.
#
# Note: conf.d context.modules entries APPEND (don't merge by name), so
# adding a second module-rt entry doesn't override the first — the first
# loads with nice.level=-11 and fails before the second is processed.
context.properties = {
    module.rt.args = {
        nice.level = 0
        rt.prio    = 88
    }
}
