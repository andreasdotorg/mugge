# F-291 Fix C: Disable mod.rt nice level manipulation.
#
# Problem: PipeWire's mod.rt calls setpriority(nice.level=-11) at startup.
# On NixOS, no PAM nice limit exists for the audio user, so the call fails
# with EPERM. mod.rt's error handler then resets scheduling to SCHED_OTHER,
# undoing systemd's pre-exec FIFO/88.
#
# Fix: Set nice.level=0 so mod.rt either skips the setpriority() call or
# succeeds trivially (0 is the default nice, no privilege needed).
# rt.prio is set to 88 for documentation clarity, but NNP=1 blocks
# mod.rt's sched_setscheduler() call — systemd's pre-exec FIFO/88
# is the sole RT promotion path.
context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level   = 0
            rt.prio      = 88
        }
        flags = [ ifexists nofail ]
    }
]
